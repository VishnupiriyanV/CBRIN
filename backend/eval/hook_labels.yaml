# Hand-labeled hook/not-hook judgments over real sentences from backend/data/chunks.json
# (436 sentences across 4 videos in this checkout), used by eval/hook_eval.py --labels to
# measure ROC-AUC and class separation for clip_scoring.py's hook_strength signal.
#
# `text` is included for human review only — hook_eval.py always re-reads the sentence text
# from chunks.json by (video_id, sentence_idx), so a stale copy here can't silently drift the
# eval. If a video_id/sentence_idx no longer exists in chunks.json (a re-ingest changed the
# library), hook_eval.py skips that row and prints a warning rather than failing the run.
#
# Labeled 2026-08-05 against a stratified sample (top/bottom/middle of the semantic-cosine
# score) so the set isn't accidentally all-easy or all-hard — see
# eval/README.md#hook-signal-calibration for the sampling method and how to extend this set.
#
# Judged as a HOOK: would this sentence, as the FIRST line of a clip, create a curiosity gap,
# ask something the viewer wants answered, or otherwise earn the next 3 seconds of attention?
# Plain factual statements, mid-narrative continuations ("And then...", "So anyways that other
# thing..."), and answers-without-the-question are judged NOT a hook, even when they contain
# superficially hook-shaped words.

labels:
  - {video_id: local-99ce947e13e5, sentence_idx: 118, is_hook: true}   # "Why has no one told me?"
  - {video_id: local-99ce947e13e5, sentence_idx: 119, is_hook: true}   # "I'm telling you, man, I've been changed."
