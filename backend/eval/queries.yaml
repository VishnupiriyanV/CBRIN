# Eval set for Vault's 'spoken' search mode (IMPROVEMENT-PLAN.md 2.1).
#
# Grounded in the actual current library (2 videos, 67 chunks post-1.1/1.2 fix):
#   - local-39470   "Test2" (an English-lesson vlog, ~3 min, local upload)
#   - yt-6szdySvorzA "The fascinating history of Databases" (~9.5 min, YouTube)
#
# Positive queries are paraphrased, not copy-pasted from the transcript, so this actually
# tests semantic/lexical retrieval rather than exact substring matching. Negative queries
# are genuinely unrelated to either video's subject matter — the "non-negotiable" set per
# the improvement plan, since a negative query returning *anything* is the failure mode
# that makes a demo confidently return a wrong clip.
#
# expected_start_sec/expected_end_sec is the acceptable window — a result counts as correct
# if its video_id matches AND its own [start_sec, end_sec] overlaps this window at all.
#
# NOTE: this is 14 positive + 10 negative, short of the plan's 25-40 target (3.5 calls for
# a 15-video test library; we only have 2 real videos to ground queries in). Extend this
# file as the library grows — do not pad it with synthetic queries that don't map to real
# content, that would defeat the point of an eval harness.

