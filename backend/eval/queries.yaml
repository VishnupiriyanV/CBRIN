# Eval set for Vault's 'spoken' search mode (IMPROVEMENT-PLAN.md 2.1).
#
# Grounded in the actual current library (1 video, 50 chunks, as of the agentic-pivot audit):
#   - local-f718cb618763   "Test2" (an English-lesson vlog, ~3 min, local upload)
#
# The "yt-6szdySvorzA" YouTube video ("The fascinating history of Databases") this file
# used to be grounded in (and the 8 database-related positive queries below it) is no
# longer in the library — it was removed from backend/data/ at some point before this
# audit, independent of this change. Per this file's own rule ("don't pad it with queries
# that don't map to real content"), those 8 queries are removed rather than left permanently
# failing and silently dragging down the recall numbers below. Re-add them (with fresh
# expected_start_sec/end_sec against the new ingest's chunking) if/when that video is
# re-ingested.
#
# This audit also found and removed a leaked pytest-fixture chunk (video_id "vid-b",
# text "This video covers python testing frameworks like pytest") that had contaminated
# the real backend/data/chunks.json — see repair_index.py's docstring for the known
# test-suite data-clobber bug this matches. That contamination (not a threshold/retrieval
# change) was the actual cause of a 0%-recall run observed right after an index-consistency
# repair; it wasn't visible in repair_index.py's diagnose output because an orphaned chunk
# with no videos.json entry looks structurally "fixable," not obviously fake.
#
# Positive queries are paraphrased, not copy-pasted from the transcript, so this actually
# tests semantic/lexical retrieval rather than exact substring matching. Negative queries
# are genuinely unrelated to the video's subject matter — the "non-negotiable" set per
# the improvement plan, since a negative query returning *anything* is the failure mode
# that makes a demo confidently return a wrong clip.
#
# expected_start_sec/expected_end_sec is the acceptable window — a result counts as correct
# if its video_id matches AND its own [start_sec, end_sec] overlaps this window at all.
#
# NOTE: this is 6 positive + 10 negative, short of the plan's 25-40 target (3.5 calls for
# a 15-video test library; we only have 1 real video to ground queries in right now). Extend
# this file as the library grows — do not pad it with synthetic queries that don't map to
# real content, that would defeat the point of an eval harness.

